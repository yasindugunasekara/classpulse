# ClassPulse configuration. All services read this file from the project root.
# Any key can also be overridden on the command line, e.g. java -Dport.classroom=7000 ...

# ---- Ports ----
port.classroom=6000
port.login=6001
port.discovery=6002
port.export=6003
# UDP port students listen on for CLASSPULSE_ANNOUNCE broadcasts (must differ from 6002,
# because the server owns 6002 when everything runs on one laptop)
port.announce=6004
port.questionweb=8080

# ---- TLS (Member 5) ----
tls.keystore=certs/server.p12
tls.keystore.password=changeit
tls.truststore=certs/client-truststore.p12
tls.truststore.password=changeit
# true = the client checks that the certificate's SAN matches the host it connects to
tls.verifyHostname=true

# ---- Attendance (Members 3 and 5) ----
attendance.defaultDurationSec=300
attendance.codeWindowSec=30
attendance.requireSameSubnet=true
attendance.maxPerDevice=1

# ---- Polls (Member 4) ----
# true = a student sees live results right after voting; false = only after the poll closes
poll.showResultsAfterVote=true

# ---- Export (Member 4) ----
# Artificial delay per export so two parallel downloads are visible in the demo log. 0 = off.
export.demoDelayMs=1500

# ---- Debug (Member 1, load test only) ----
# Writes joinCode|attendanceCode to data/current_code.txt so LoadTestClient can mark attendance.
# Set to false for a real class.
debug.exposeAttendanceCode=true
